services:
  ornament:
    image: ghcr.io/mot1us/ornament:0.10.5
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 100
    environment:
      ADMIN_PASSWORD_HASH: "${ADMIN_PASSWORD_HASH:-}"
      PUBLIC_URL: "${PUBLIC_URL:-http://localhost:3080}"
      EMAIL_MODE: "${EMAIL_MODE:-preview}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      HOST: 0.0.0.0
      PORT: 3080
      DATA_DIR: /data
      COOKIE_SECURE: "true"
      TRUST_PROXY_HOPS: "1"
    expose:
      - "3080"
    volumes:
      - santa_data:/data
      - santa_backups:/backups
    networks:
      - pangolin_frontend
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  ornament-backup:
    image: ghcr.io/mot1us/ornament:0.10.5
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 50
    command: ["node", "scripts/backup-loop.js"]
    environment:
      DATA_DIR: /data
    volumes:
      - santa_data:/data:ro
      - santa_backups:/backups
    depends_on:
      ornament:
        condition: service_healthy
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      disable: true

volumes:
  santa_data:
  santa_backups:

networks:
  pangolin_frontend:
    external: true
